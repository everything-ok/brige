captcha_indicators:
  - selector: '#challenge-running, #challenge-stage'
    name: "Cloudflare Challenge"
  - selector: 'iframe[src*="challenges.cloudflare.com"]'
    name: "Cloudflare Turnstile"
  - selector: 'iframe[src*="hcaptcha.com"]'
    name: "hCaptcha"
  - selector: '[class*="hcaptcha"]'
    name: "hCaptcha Widget"
  - selector: 'iframe[src*="recaptcha"]'
    name: "reCAPTCHA"
  - selector: '.g-recaptcha'
    name: "reCAPTCHA Widget"
  - selector: '[class*="captcha" i], [id*="captcha" i]'
    name: "Generic Captcha"
  - selector: '[class*="challenge" i], [id*="challenge" i]'
    name: "Generic Challenge"
  - selector: 'text="Verify you are human"'
    name: "Human Verification Text"
  - selector: 'text="Please complete the security check"'
    name: "Security Check Text"
