  - name: venice
    enabled: true
    # 必须用经典聊天：默认的 /chat/agent 是 Agent 模式，会把任务复述进
    # assistant-content 块并等确认，永远不产生真正的回复（桥接只能抓到复读）
    url: "https://venice.ai/chat/classic"
    priority: 1

    selectors:
      # 登录校验（正反组合）：页面已渲染出输入框(正面) 且 无"Venice Guest"按钮(反面)
      # 才判定已登录 —— 纯反面条件会在页面加载中/空白时误判
      logged_in_selector: 'textarea, !button:has-text("Venice Guest"), !a:has-text("Venice Guest"), !span:has-text("Venice Guest")'
      login_check_url: "https://venice.ai/chat/classic"
      input: 'textarea[placeholder*="message" i], textarea[placeholder*="ask" i], [contenteditable="true"], textarea'
      send_button: 'button[aria-label*="send" i], button[type="submit"]'
      # 经典模式下 assistant 回复在用户气泡之后，取文档序最后一个匹配即可；
      # assistant-content 放最前兜底 agent 页面残留
      response: 'div.assistant-content, [class*="markdown" i], [class*="prose"]'
      stop_button: 'button[aria-label*="stop" i]'
      response_timeout: 150

    models:
      venice-default: "default"

