    priority: 5

    selectors:
      input: 'textarea.semi-input-textarea, textarea[placeholder*="发消息" i], textarea'
      send_button: 'button[type="submit"], button[aria-label*="send" i], button:has-text("发送")'
      response: '[class*="message" i][class*="bot" i], [class*="markdown" i], [class*="prose" i]'
      stop_button: 'button[aria-label*="stop" i], button[aria-label*="停止" i]'

    models:
